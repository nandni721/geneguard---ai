<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GeneGuard AI</title>

<style>
body{
background:#0B1020;
font-family:Arial;
color:white;
padding:20px;
text-align:center;
}
.card{
background:#1E293B;
padding:20px;
border-radius:15px;
margin:20px 0;
}
input,select{
width:90%;
padding:10px;
margin:8px;
border-radius:10px;
border:none;
}
button{
background:#8B5CF6;
color:white;
padding:12px 20px;
border:none;
border-radius:12px;
font-size:16px;
margin-top:10px;
}
h1{color:#A855F7;}
</style>
</head>

<body>

<h1>🧬 GeneGuard AI</h1>
<p>AI-Powered Genetic Health & Nutrition Intelligence Platform</p>

<div class="card">
<h2>👤 Health Profile</h2>

<input id="name" placeholder="Your Name">

<input id="age" type="number" placeholder="Age">

<select id="gender">
<option>Female</option>
<option>Male</option>
<option>Other</option>
</select>
</div>

<div class="card">
<h2>BMI Calculator</h2>

<input id="weight" type="number" placeholder="Weight (kg)">
<input id="height" type="number" placeholder="Height (m)">

<button onclick="calculateBMI()">Calculate BMI</button>

<p id="bmiResult"></p>
</div>

<div class="card">
<h2>🩸 Anemia Risk Prediction</h2>

<input id="hb" type="number" placeholder="Hemoglobin (g/dL)">

<button onclick="checkAnemia()">Check Risk</button>

<p id="anemiaResult"></p>
</div>

<div class="card">
<h2>❤️ AI Health Dashboard</h2>

<h3 id="healthScore">Health Score : 100%</h3>

<p id="waterResult">💧 Water Goal : --</p>

<p id="dietResult">🥗 AI Diet Recommendation will appear here.</p>
</div>

<div class="card">
<h2>📄 AI Health Report</h2>

<button onclick="generateReport()">Generate Report</button>

<p id="report"></p>
</div>

<script>

function calculateBMI(){

let w=parseFloat(document.getElementById("weight").value);

let h=parseFloat(document.getElementById("height").value);

let bmi=w/(h*h);

let status="";

if(bmi<18.5) status="Underweight";
else if(bmi<25) status="Normal";
else if(bmi<30) status="Overweight";
else status="Obese";

document.getElementById("bmiResult").innerHTML=
"Your BMI : "+bmi.toFixed(2)+" ("+status+")";

calculateWater();
updateScore();
diet();
}

function checkAnemia(){

let hb=parseFloat(document.getElementById("hb").value);

let risk="";

if(hb<11) risk="🔴 High Anemia Risk";
else if(hb<12) risk="🟡 Medium Anemia Risk";
else risk="🟢 Low Anemia Risk";

document.getElementById("anemiaResult").innerHTML=risk;

updateScore();
diet();
}

function calculateWater(){

let w=parseFloat(document.getElementById("weight").value);

let water=(w*35)/1000;

document.getElementById("waterResult").innerHTML=
"💧 Daily Water Goal : "+water.toFixed(2)+" L";
}

function diet(){

let hb=parseFloat(document.getElementById("hb").value);

let w=parseFloat(document.getElementById("weight").value);

let h=parseFloat(document.getElementById("height").value);

let bmi=w/(h*h);

let text="🥗 Balanced vegetarian diet with fruits, dal, milk and vegetables.";

if(hb<12){
text="🥬 Iron-rich foods: Spinach, Beetroot, Dates, Jaggery, Lentils, Orange, Amla.";
}

if(bmi<18.5){
text+=" Add Paneer, Banana, Nuts and Soybean for healthy weight gain.";
}

document.getElementById("dietResult").innerHTML=text;
}

function updateScore(){

let score=100;

let hb=parseFloat(document.getElementById("hb").value);

let w=parseFloat(document.getElementById("weight").value);

let h=parseFloat(document.getElementById("height").value);

let bmi=w/(h*h);

if(hb<12) score-=15;

if(bmi<18.5 || bmi>25) score-=10;

document.getElementById("healthScore").innerHTML=
"Health Score : "+score+"%";
}

function generateReport(){

let name=document.getElementById("name").value;

let bmi=document.getElementById("bmiResult").innerHTML;

let anemia=document.getElementById("anemiaResult").innerHTML;

let water=document.getElementById("waterResult").innerHTML;

let diet=document.getElementById("dietResult").innerHTML;

let score=document.getElementById("healthScore").innerHTML;

document.getElementById("report").innerHTML=
"<b>"+name+"'s AI Health Report</b><br><br>"+
bmi+"<br>"+anemia+"<br>"+water+"<br>"+score+
"<br><br>"+diet+
"<br><br>✅ Stay hydrated and follow a healthy lifestyle.";
}

</script>

</body>
</html>
