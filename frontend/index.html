<!DOCTYPE html>
<html>
<head>
  <title>GeneGuard AI</title>
</head>

<body style="margin:0;background:#0B1020;color:white;font-family:Arial;padding:20px;">

  <div style="background:#6D28D9;padding:20px;border-radius:15px;text-align:center;">
    <h1>🧬 GeneGuard AI</h1>
    <p>AI-powered Genetic Health & Nutrition Intelligence Platform</p>
  </div>

  <h2 style="color:#A78BFA;">⚖ BMI Calculator</h2>
  <input id="weight" type="number" placeholder="Weight (kg)" style="padding:10px;border-radius:8px;"><br><br>

  <input id="height" type="number" placeholder="Height (m)" style="padding:10px;border-radius:8px;"><br><br>

  <button onclick="calculateBMI()" style="background:#8B5CF6;color:white;padding:10px 20px;border:none;border-radius:8px;">
    Calculate BMI
  </button>

  <p id="result"></p>

  <hr>

  <h2 style="color:#F87171;">🩸 Anemia Risk Predictor</h2>
  <input id="hb" type="number" placeholder="Hemoglobin (g/dL)" style="padding:10px;border-radius:8px;"><br><br>

  <button onclick="checkAnemia()" style="background:#DC2626;color:white;padding:10px 20px;border:none;border-radius:8px;">
    Check Anemia Risk
  </button>

  <p id="anemiaResult"></p>

  <hr>

  <h2 style="color:#22C55E;">🥗 AI Diet Recommendation</h2>
  <p id="diet">Eat protein-rich vegetarian food, fruits and green vegetables.</p>

  <hr>

  <h2 style="color:#38BDF8;">💧 Water Intake Tracker</h2>
  <p>Daily Goal: <b>2.5 Litres</b></p>

  <hr>

  <h2 style="color:#C084FC;">📊 Health Score</h2>
  <h1>92%</h1>

  <script>
    function calculateBMI() {
      let w = parseFloat(document.getElementById("weight").value);
      let h = parseFloat(document.getElementById("height").value);

      let bmi = w / (h * h);

      document.getElementById("result").innerHTML =
        "Your BMI is " + bmi.toFixed(2);
    }

    function checkAnemia() {
      let hb = parseFloat(document.getElementById("hb").value);

      if (hb < 11) {
        document.getElementById("anemiaResult").innerHTML = "🔴 High Anemia Risk";
      } else if (hb < 12) {
        document.getElementById("anemiaResult").innerHTML = "🟠 Medium Anemia Risk";
      } else {
        document.getElementById("anemiaResult").innerHTML = "🟢 Low Anemia Risk";
      }
    }
  </script>

</body>
</html>
